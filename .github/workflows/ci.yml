name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      post_merge_sha:
        description: Exact helianthus-modbus PR #6 squash merge SHA
        required: false
        type: string

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Checkout exact FMV3 docs candidate
        uses: actions/checkout@v4
        with:
          repository: Project-Helianthus/helianthus-docs-ebus
          ref: 0dd470495ac69a3a7f30ec235dd0bb83977a99ad
          path: .ci/fmv3-docs-candidate
          fetch-depth: 1

      - name: Fetch aggregate review evidence history
        run: git fetch --no-tags origin +refs/pull/66/head:refs/remotes/origin/evidence/aggregate

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate plans repo
        run: ./scripts/validate_plans_repo.sh
        env:
          GH_TOKEN: ${{ github.token }}
          FMV3_DOCS_CANDIDATE_ROOT: ${{ github.workspace }}/.ci/fmv3-docs-candidate

  modbus-m1-02-remote-attestation:
    if: >-
      (github.event_name == 'pull_request' &&
       github.event.pull_request.number == 84) ||
      (github.event_name == 'workflow_dispatch' &&
       github.ref == 'refs/heads/main' &&
       inputs.post_merge_sha != '')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout reviewed anchor
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: >-
            ${{ github.event_name == 'workflow_dispatch' &&
                'main' || github.event.pull_request.head.sha }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate Modbus M1-02 remote attestation
        run: >-
          ./scripts/validate_modbus_m1_02_remote_attestation.sh
          "${{ inputs.post_merge_sha }}"
        env:
          GH_TOKEN: ${{ github.token }}
