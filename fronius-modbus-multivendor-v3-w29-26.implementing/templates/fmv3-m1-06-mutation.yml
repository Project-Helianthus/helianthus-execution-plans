name: FMV3 M1-06 Mutation

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      case_id:
        description: Exact FMV3 M1-06 mutation case
        required: true
        type: choice
        options:
          - M1-06-DELIVERABILITY-EXCLUSIONS
          - M1-06-COPY-ONE-WINNER
          - M1-06-STALE-INSTANCE-CANCEL-ISOLATION
          - M1-06-TERMINAL-OUTCOMES
          - M1-06-MEMBERSHIP-CLOSE-RACE
          - M1-06-BOUNDS-OVERFLOW
          - M1-06-SEQUENCE-EXHAUSTION
          - M1-06-COALESCED-ISOLATION

permissions:
  contents: read

env:
  GOOS: linux
  GOARCH: amd64
  CGO_ENABLED: "0"
  GOWORK: "off"

jobs:
  red-guard:
    if: github.event_name == 'pull_request'
    name: FMV3 M1-06 RED guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Verify exact PR head
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
      - name: Validate test-only RED diff
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$(git log -1 --pretty=%s)" != "test: FMV3-M1-06 RED conformance" ]]; then
            exit 0
          fi
          test "$(git rev-parse HEAD^)" = "${{ github.event.pull_request.base.sha }}"
          mapfile -t paths < <(git diff-tree --no-commit-id --name-only -r HEAD)
          [[ ${#paths[@]} -gt 0 ]]
          found_test=false
          for path in "${paths[@]}"; do
            case "$path" in
              *_test.go|testdata/*|*/testdata/*|fixtures/*|*/fixtures/*|.github/fmv3/fmv3-m1-06-conformance-report.json) ;;
              *) echo "RED touched non-test path: $path" >&2; exit 1 ;;
            esac
            [[ "$path" == *_test.go ]] && found_test=true
          done
          [[ "$found_test" == true ]]

  conformance:
    if: github.event_name == 'pull_request'
    name: FMV3 M1-06 conformance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Verify exact PR head
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
      - name: Verify merged docs lock before build and tests
        run: python3 scripts/fmv3_m1_06_docs_lock.py
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.22"
          cache: false
      - name: go test -run ^$ .
        run: go test -run '^$' .
      - name: Validate GREEN root package and production API binding
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$(git log -1 --pretty=%s)" == "test: FMV3-M1-06 RED conformance" ]]; then
            test "$(git rev-parse HEAD^)" = "${{ github.event.pull_request.base.sha }}"
            echo "semantic binding is evaluated on GREEN"
            exit 0
          fi
          go run ./scripts/fmv3_m1_06_mutation_guard.go \
            --verify-conformance .github/fmv3/fmv3-m1-06-conformance-report.json
      - name: Run exact M1-06 conformance tests
        run: >-
          go test -run
          '^(TestDeliverabilityExclusions|TestCopiedCapabilityOneWinner|TestStaleAttemptInstanceCancellationIsolation|TestTerminalOutcomes|TestAttemptMembershipCloseRegistrationRace|TestBoundsAndOverflow|TestTerminalSequenceExhaustion|TestCoalescedDependentIsolation)$'
          .

  mutation:
    if: github.event_name == 'workflow_dispatch'
    name: mutation/${{ inputs.case_id }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact mutant
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Verify merged docs lock before build and tests
        run: python3 scripts/fmv3_m1_06_docs_lock.py
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.22"
          cache: false
      - name: Validate executable AST mutation
        run: >-
          go run ./scripts/fmv3_m1_06_mutation_guard.go
          --case "${{ inputs.case_id }}" --base HEAD^ --mutant HEAD
      - name: baseline/${{ inputs.case_id }}
        run: |
          mutant_sha="$(git rev-parse HEAD)"
          git checkout --detach HEAD^
          case "${{ inputs.case_id }}" in
            M1-06-DELIVERABILITY-EXCLUSIONS) go test -run '^TestDeliverabilityExclusions$' . ;;
            M1-06-COPY-ONE-WINNER) go test -run '^TestCopiedCapabilityOneWinner$' . ;;
            M1-06-STALE-INSTANCE-CANCEL-ISOLATION) go test -run '^TestStaleAttemptInstanceCancellationIsolation$' . ;;
            M1-06-TERMINAL-OUTCOMES) go test -run '^TestTerminalOutcomes$' . ;;
            M1-06-MEMBERSHIP-CLOSE-RACE) go test -run '^TestAttemptMembershipCloseRegistrationRace$' . ;;
            M1-06-BOUNDS-OVERFLOW) go test -run '^TestBoundsAndOverflow$' . ;;
            M1-06-SEQUENCE-EXHAUSTION) go test -run '^TestTerminalSequenceExhaustion$' . ;;
            M1-06-COALESCED-ISOLATION) go test -run '^TestCoalescedDependentIsolation$' . ;;
            *) exit 2 ;;
          esac
          git checkout --detach "$mutant_sha"
      - name: go test -run ^$ .
        run: go test -run '^$' .
      - name: mutant/${{ inputs.case_id }}
        run: |
          case "${{ inputs.case_id }}" in
            M1-06-DELIVERABILITY-EXCLUSIONS) go test -run '^TestDeliverabilityExclusions$' . ;;
            M1-06-COPY-ONE-WINNER) go test -run '^TestCopiedCapabilityOneWinner$' . ;;
            M1-06-STALE-INSTANCE-CANCEL-ISOLATION) go test -run '^TestStaleAttemptInstanceCancellationIsolation$' . ;;
            M1-06-TERMINAL-OUTCOMES) go test -run '^TestTerminalOutcomes$' . ;;
            M1-06-MEMBERSHIP-CLOSE-RACE) go test -run '^TestAttemptMembershipCloseRegistrationRace$' . ;;
            M1-06-BOUNDS-OVERFLOW) go test -run '^TestBoundsAndOverflow$' . ;;
            M1-06-SEQUENCE-EXHAUSTION) go test -run '^TestTerminalSequenceExhaustion$' . ;;
            M1-06-COALESCED-ISOLATION) go test -run '^TestCoalescedDependentIsolation$' . ;;
            *) exit 2 ;;
          esac
