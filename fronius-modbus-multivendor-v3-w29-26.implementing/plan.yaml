review_scope:
  - implementability
  - correctness/data integrity
  - protocol interoperability
  - security/safety
  - licensing/IP boundary
  - operability/recovery
  - testability
  - dependency/DAG feasibility

decisions:
  - id: D01
    status: accepted
    decision: One public helianthus-modbus owns Modbus protocol, TCP and RTU transports, endpoint scheduling, limits, and recovery; the exact ordered abnormal transport-write result set is provable_zero, partial_write, indeterminate_error, cancellation_race, ambiguous_completion, only provable_zero avoids abandonment, every other abnormal result forces TCP close/reconnect handling and RTU quarantine/recovery, full_transmit_success separately enters response_wait with TCP tombstone/late-drop or RTU quarantine on wait timeout/cancellation, and unit/profile state remains isolated. RTU remains default-disabled experimental fixture-only capability until RTU_PHYSICAL_QUALIFICATION_V1 passes; absent hardware creates no enabled/supported claim and blocks no TCP-sufficient M1, Fronius, or M7 work.
  - id: D02
    status: accepted
    decision: One public helianthus-modbusreg owns standard and vendor profile families; no repository is created per vendor.
  - id: D03
    status: accepted
    decision: SunSpec is a standard profile family; public evidence companion FMV3-M3-01 governs M3-02/M3-03, Fronius uses STANDARD_ONLY with public evidence and no implementation commit or empty overlay when qualified evidence proves the slice fully standard, and OVERLAY_REQUIRED alone triggers overlay RED/code work; FMV3-M7-01 pre-publishes the complete Growatt candidate/admission contract and governs M7-02/M7-03/M7-04, PROFILE_ADMITTED alone triggers RED/code, and NO_ADMISSIBLE_PROFILE preserves the pre-published public evidence and unsupported disposition without code, catalog, or support claim.
  - id: D04
    status: accepted
    decision: Fronius phase 1 is Modbus TCP read-only, with no write function, write probe, or control API.
  - id: D05
    status: accepted
    decision: Profile detection is deterministic, bounded, read-only, version-aware, and fail-closed; fixture-only profiles are default-disabled experimental opt-in, and automatic eligibility requires a matching hardware qualification record.
  - id: D06
    status: accepted
    decision: Raw MCP and live Fronius evidence precede canonical PV docs and semantic implementation; candidate Fronius-to-canonical mapping and semantic MCP then pass golden and live tests before a separate lock pins that exact MCP version, after which promotion serializes through one public GraphQL companion-doc issue, GraphQL whose credential-bearing external channel is authenticated/confidential with verified server identity, a GraphQL-only semantic Portal plus authenticated bounded raw Portal diagnostics, Home Assistant, and packaged rollout.
  - id: D07
    status: accepted
    decision: Private eeBUS and Matter repositories are generic output bindings and start implementation only after the completed public consumer and packaged rollout; both consume exactly PUBLIC_GRAPHQL_M2M_V1 by authenticated bounded query/polling with compatible version enforcement, noninteractive least privilege, confidential transport, verified server identity, and credential lifecycle/recovery, and reject plaintext, untrusted identity, subscriptions, Modbus/modbusreg/gateway-internal imports, and undocumented network paths. eeBUS additionally owns minimum SHIP/SPINE discovery and trust lifecycle; this plan creates no public eeBUS repository.
  - id: D08
    status: accepted
    decision: Public repositories, CI, builds, tests, and documentation never depend on private repositories or private artifacts.
  - id: D09
    status: accepted
    decision: Huawei facts are re-derived with provenance and branch-specific applicability; v49 and v52 are parallel branches, EMMA semantics remain deferred, M7-01 inventories or individually marks unavailable its gateway/model/software/version discriminators, and EMMA or insufficiently distinguished endpoints can only return no_match or insufficient_evidence and never activate SmartLogger/S-Dongle or Huawei automatic eligibility.
  - id: D10
    status: accepted
    decision: Milestones group work; the issue DAG is authoritative, TCP precedes RTU in helianthus-modbus, FMV3-M7-01 waits for the critical docs lane through FMV3-M5-09 before serialized M7 profile work, Growatt NO_ADMISSIBLE_PROFILE still releases Huawei without a conditional GO gate, and topology/preflight enforce at most one active issue and one active PR per repository.
  - id: D11
    status: accepted
    decision: Gateway package internal/modbusadapter implements the existing protocol-agnostic adapter interface and is the only gateway package allowed to import helianthus-modbus or helianthus-modbusreg; gateway core tests use a fake adapter.
  - id: D12
    status: accepted
    decision: Every physical read response has a wire_response_id bound to its physical request/range, and every dependent logical observation has a linked logical_view_id plus exact slice identity; raw dependency identity also includes endpoint, unit, function/table, logical zero-based PDU offset/count, sample identity, and recorded documentary address normalization. Versioned modbusreg codec/provenance fields own multi-register word order, applicable intra-word byte order, string packing and padding, while profile-declared coherence rejects unrecoverable torn multi-response reads.
  - id: D13
    status: accepted
    decision: FMV3-M1-05 documents and FMV3-M1-06 implements OPAQUE_RUNTIME_ACQUISITION_V1 as an additive successor to M1-04 before M2-01. A runtime source privately owns and issues each non-serializable one-shot capability only after all post-correlation successful-dependent deliverability conditions; only copies of that same capability share its state, and M1 state is never an M2 ledger pointer. Endpoint recreation and every new acquisition create fresh independent state even when visible identity or data match. Capability state moves open to claimed, cancelled, failed, or expired and is synchronously reclaimed by a pre-reserved terminal sequence into a finite-positive, byte-bounded, non-reconstructing tombstone ring. M2-01 pins the merged M1-06 producer SHA, keeps runtime and fixture trust distinct, and owns a separately bounded attempt/claim ledger across every retained state. The exact docs R2 binding requires unresolved claims to enter claim_in_progress before one immutable terminal result, open or sealed attempts to enter cancelling before cancelled, an atomic seal predicate requiring a nonempty exact ordered all-runtime dependency set with exact cardinality and every claim_succeeded, runtime-source-owned CancelOpen linearized by the exact opaque closed AttemptInstance with frozen membership, explicit byte and field bounds validated before allocation, one-shot sealed-to-publishing Publish(), and pre-reserved nonzero uint64 terminal sequences that never wrap or reuse. Deterministic reclamation preserves only bounded non-reconstructing audit metadata and the complete normalization record round-trips losslessly within admitted bounds. Consumer CI locks the merged docs SHA and policy/manifest hashes, exercises the eight downstream race/membership/ordering/seal/projection rows, and permits publication only through the five-field published_attempt_v1 projection with one atomic publish/cancel winner.

milestones:
  - id: M0
    title: Governance, repository bootstraps, and boundary documentation
    depends_on: []
    exit_gate: Governance has created the four planned repositories, destination bootstraps have run after creation, and public/private import direction is documented.
  - id: M1
    title: helianthus-modbus foundation
    depends_on: [M0]
    exit_gate: 'The original bounded public Modbus companion remains merged and protocol core plus TCP/RTU conformance are green. After M1-04, FMV3-M1-05 may be authorized before docs merge, but M1-06 requires docs PR #386 merged at its exact bound docs R2 head/tree before strict hosted RED/GREEN implementation; fresh independent review must accept the exact docs, RED, and GREEN revisions. RTU fixture conformance may close as default-disabled experimental FIXTURE_ONLY_NO_HARDWARE; only RTU_PHYSICAL_QUALIFICATION_V1 permits an enabled/supported RTU claim, and its absence blocks no TCP-sufficient work.'
  - id: M2
    title: helianthus-modbusreg framework
    depends_on: [M0]
    exit_gate: The reused FMV3-M1-00 companion remains merged, and M2-01 starts only after M1-06 merges and external authorization evidence supplies bounded selectors whose live GitHub objects prove the exact immutable marked/title issue and exact closing product squash PR on canonical main. A preceding owner-authored harness PR under the same issue must be the sole active PR, merge first with required checks and one clean exact-head Codex review, add only the plan-anchored dual-mode workflow, AST guard, docs-lock validator, and exact merged-docs lock, leave inherited ci.yml and ci_local.sh unchanged, and become the exact product PR base. The RED commit has the exact validator-pinned subject and test-only diff; the anchored pull_request workflow proves its RED guard and compile/no-tests succeed before the exact conformance suite fails. The implementation head has app-bound required checks green and the same anchored workflow proves conformance success. Eight exact-parent production-only mutants retain the exact harness blobs, match canonical patch digests precommitted by the GREEN report, pass the AST guard and parent mapped test, compile, and only then fail the exact mutant mapped test. The product head then receives one official Codex canonical-template zero-inline review and two owner NO_FINDINGS process attestations after GREEN and mutations; the fixed-path closed conformance report binds every validator-pinned case to an exact Go test/source blob/PASS, exact mutation patch digest, and exact production contract symbols. The exact docs R2 head/tree binding requires claim_in_progress and cancelling states, a nonempty exact ordered all-runtime dependency-set seal predicate with exact cardinality and every claim succeeded, runtime-source-owned CancelOpen linearization by the exact opaque closed AttemptInstance with frozen membership, byte and field bounds validated before allocation, and pre-reserved nonzero uint64 terminal sequences that never wrap or reuse. Profile API, exact wire-response/logical-view/sample identity and provenance, runtime-versus-fixture trust, independently ledger-owned bounded attempt/claim state across all retained states, finite-positive limits with a checked retained-attempt-limit times claim-limit product, duplicate AttemptKey rejection, complete immutable-terminal lifecycles, one-shot sealed publication, deterministic synchronous terminal-sequence reclamation into a finite-positive byte-bounded non-reconstructing audit/tombstone ring, exact bounded normalization round-trip, detector lifecycle, merged-docs SHA plus policy/manifest consumer lock, all eight downstream behavioral rows, five-field published_attempt_v1 projection, and atomic publish/cancel winner are stable under strict hosted RED/GREEN and fresh independent review.
  - id: M3
    title: Minimal SunSpec family, Fronius applicability, and fixtures
    depends_on: [M2]
    exit_gate: Companion FMV3-M3-01 governs the minimal standard SunSpec family and Fronius disposition; STANDARD_ONLY records public evidence with green conformance CI and no implementation commit or empty overlay, while only OVERLAY_REQUIRED triggers overlay RED/code work.
  - id: M4
    title: Gateway raw MCP integration and live read-only proof
    depends_on: [M3]
    exit_gate: The gateway-local adapter boundary, raw MCP replay, and coherent sample identity pass; FMV3-M4-04 records outcome GO and FMV3-M4-05 packages its sanitized evidence before M5 can progress.
  - id: M5
    title: Canonical PV semantic lock and public consumer promotion
    depends_on: [M4]
    exit_gate: Public canonical docs and semantic implementation precede FMV3-M5-04 candidate mapping plus golden/live semantic MCP tests; FMV3-M5-03 then locks that exact MCP version with GO before serialized PUBLIC_GRAPHQL_M2M_V1 companion docs, externally tested GraphQL, Portal, Home Assistant, and compatibility-safe add-on packaging, while bounded raw Portal diagnostics remain separate.
  - id: M6
    title: Generic private eeBUS binding and myVaillant lab proof
    depends_on: [M5]
    exit_gate: After the public eeBUS companion merges, the private binding consumes exactly the packaged GraphQL contract and proves SHIP/SPINE lifecycle; M6-02 succeeds only on live GO, and M6-03 then publishes sanitized reusable interoperability knowledge or records STOP when provenance/licensing forbids publication.
  - id: M7
    title: SunSpec, Growatt, and Huawei profile expansion
    depends_on: [M1, M2, M3]
    exit_gate: After the Fronius vertical and critical docs lane through FMV3-M5-09, companion FMV3-M7-01 publishes the complete Growatt contract and an EMMA gateway/model/software/version discriminator inventory or per-field unavailable markers; serialized SunSpec, Growatt, and Huawei work keeps EMMA semantics deferred and blocks Huawei automatic eligibility when reliable discrimination is unavailable.
  - id: M8
    title: Generic private Matter binding
    depends_on: [M0, M5]
    exit_gate: After packaged M5-08 rollout and the public Matter companion, exactly one M8 ingress consumes PUBLIC_GRAPHQL_M2M_V1 through the same authenticated bounded query/polling, compatibility, confidential-channel, verified-identity, and credential lifecycle/recovery contract as eeBUS; security tests reject forbidden imports and undocumented network paths, independently of M6.

phase_gates:
  - id: PG-REPOSITORY-CREATION
    kind: dependency
    after_issues: [FMV3-M0-01]
    before_issues: [FMV3-M0-02, FMV3-M0-03]
    requirement: Existing governance creates both public Modbus repositories before either public destination bootstrap issue runs; private governance creation FMV3-M0-04 and private bootstraps FMV3-M0-05/FMV3-M0-07 require future explicit authorization.
  - id: PG-MODBUS-BOOT
    kind: dependency
    after_issues: [FMV3-M0-02]
    before_issues: [FMV3-M1-00, FMV3-M1-01]
    requirement: The public runtime repository is bootstrapped before its public companion contract and protocol code.
  - id: PG-MODBUS-DOC-GATE
    kind: dependency
    after_issues: [FMV3-M1-00]
    before_issues: [FMV3-M1-01, FMV3-M1-02, FMV3-M1-03, FMV3-M1-04, FMV3-M2-01, FMV3-M2-02, FMV3-M2-03]
    requirement: The single bounded public companion publishes transport-write linearization and the M1 runtime plus complete M2 source-observation/provenance, detector lifecycle, qualification, coherence, and fixture/mutation contracts before every M1/M2 implementation issue; each carries the same companion metadata.
  - id: PG-OPAQUE-ACQUISITION-DOC-GATE
    kind: dependency
    after_issues: [FMV3-M1-05]
    before_issues: [FMV3-M1-06]
    requirement: 'The public OPAQUE_RUNTIME_ACQUISITION_V1 companion merges after M1-04 through docs PR #386 at the exact bound docs R2 head/tree before M1-06 code. That exact binding includes claim_in_progress and cancelling states, a nonempty exact ordered all-runtime dependency-set seal predicate with exact cardinality and every claim succeeded, runtime-source-owned CancelOpen linearization by the exact opaque closed AttemptInstance with frozen membership, byte and field bounds validated before allocation, and pre-reserved nonzero uint64 terminal sequences that never wrap or reuse. The source-kind, source-private capability, deliverability, copy sharing, fresh acquisition, bounded lifecycle, one-shot Publish, reclamation, coalescing, and normalization contract remains exact. Fresh independent OpenAI review blocks merge.'
  - id: PG-OPAQUE-ACQUISITION-CONSUMER-PIN
    kind: dependency
    after_issues: [FMV3-M1-06]
    before_issues: [FMV3-M2-01]
    requirement: M2-01 cannot begin until M1-06 has merged and bounded external selectors resolve live to its immutable marked/title issue; a sequential owner harness PR with required checks, one clean exact-head Codex review, only the anchored workflow, AST guard, docs-lock validator, and exact merged-docs lock additions, unchanged inherited CI tooling, and canonical-main merge; the exact closing product squash PR based directly on that harness merge; a test-only RED ancestor with exact subject, empty second diff page, and anchored exact-PR guard/compile success followed by exact-suite failure; exact-head app-bound required checks and anchored conformance success; eight exact-parent production-only mutants retaining the harness blobs, matching report-bound patch digests, passing AST and parent-baseline guards plus compile, then failing only the mapped mutant test; one official Codex zero-inline review and two owner NO_FINDINGS attestations after GREEN and mutations; and the fixed report binding exact Go test/source blobs, PASS, mutation digests, and production symbols. The exact docs R2 binding must also verify through the merged docs SHA plus policy/manifest hash lock and all eight downstream behavioral conformance rows.
  - id: PG-MODBUSREG-BOOT
    kind: dependency
    after_issues: [FMV3-M0-03]
    before_issues: [FMV3-M2-01]
    requirement: The public profile repository is bootstrapped before profile code.
  - id: PG-EEBUS-BOOT
    kind: dependency
    after_issues: [FMV3-M0-05]
    before_issues: [FMV3-M6-01]
    requirement: The private eeBUS repository is bootstrapped before binding code.
  - id: PG-MATTER-BOOT
    kind: dependency
    after_issues: [FMV3-M0-07]
    before_issues: [FMV3-M8-01]
    requirement: The private Matter repository is bootstrapped before binding code.
  - id: PG-RAW-FIRST
    kind: conditional
    conditional_gate: CG-M4-LIVE-GO
    after_issues: [FMV3-M4-04, FMV3-M4-05]
    before_issues: [FMV3-M5-01, FMV3-M5-02, FMV3-M5-03]
    requirement: FMV3-M4-04 completion alone is insufficient; only outcome GO plus completed FMV3-M4-05 evidence packaging permits M5 raw/semantic work.
  - id: PG-PV-DOC-GATE
    kind: dependency
    after_issues: [FMV3-M5-02]
    before_issues: [FMV3-M5-01]
    requirement: The public canonical PV documentation merges before semantic implementation begins; FMV3-M5-02 retains the M4 evidence prerequisites.
  - id: PG-SEMANTIC-LOCK
    kind: conditional
    conditional_gate: CG-M5-SEMANTIC-GO
    after_issues: [FMV3-M5-03]
    before_issues: [FMV3-M5-09]
    requirement: FMV3-M5-04 candidate semantic MCP must be a completed ancestor of FMV3-M5-03; issue completion alone is insufficient, and GraphQL promotion plus later consumers require M5-03 GO on that exact golden- and live-tested MCP version.
  - id: PG-CONSUMER-PROMOTION
    kind: dependency
    after_issues: [FMV3-M5-03]
    before_issues: [FMV3-M5-09, FMV3-M5-05, FMV3-M5-06, FMV3-M5-07]
    requirement: Candidate semantic MCP passes golden/live tests before M5-03 locks its exact version; only then may public GraphQL companion docs, GraphQL implementation, GraphQL-only semantic Portal plus separately authenticated bounded raw Portal diagnostics, and Home Assistant proceed.
  - id: PG-GRAPHQL-DOC-GATE
    kind: dependency
    after_issues: [FMV3-M5-09]
    before_issues: [FMV3-M5-05]
    requirement: The one PUBLIC_GRAPHQL_M2M_V1 public companion issue merges its schema projection, external access/security/channel, compatibility/versioning, credential lifecycle, and recovery contract before GraphQL implementation.
  - id: PG-PUBLIC-ROLLOUT
    kind: dependency
    after_issues: [FMV3-M5-08]
    before_issues: [FMV3-M6-00, FMV3-M8-00]
    requirement: Public eeBUS and Matter companion work starts only after M5-08 packages and externally tests PUBLIC_GRAPHQL_M2M_V1.
  - id: PG-EEBUS-DOC-GATE
    kind: dependency
    after_issues: [FMV3-M6-00]
    before_issues: [FMV3-M6-01]
    requirement: The sanitized permissively publishable SHIP/SPINE binding contract merges before private eeBUS implementation; reusable myVaillant findings later publish through M6-03 or STOP.
  - id: PG-MATTER-DOC-GATE
    kind: dependency
    after_issues: [FMV3-M8-00]
    before_issues: [FMV3-M8-01]
    requirement: The sanitized permissively publishable Matter binding contract merges before private Matter implementation.
  - id: PG-VENDOR-EXPANSION
    kind: dependency
    after_issues: [FMV3-M1-04, FMV3-M2-03, FMV3-M3-03, FMV3-M7-01]
    before_issues: [FMV3-M7-02]
    requirement: The serialized SunSpec expansion starts only after shared runtime/profile contracts, the Fronius minimal vertical, and FMV3-M7-01 has merged the complete Growatt candidate/admission contract after the critical docs lane reaches FMV3-M5-09; M7-03 consumes that companion, and completed Growatt admission or non-admission then releases Huawei.
  - id: PG-READ-ONLY
    kind: policy
    after_issues: []
    before_issues: []
    requirement: Write support is out of scope until a separate safety plan is reviewed and locked.
  - id: PG-RECOVERABLE-RELEASE
    kind: dependency
    after_issues: [FMV3-M5-06, FMV3-M5-07]
    before_issues: [FMV3-M5-08]
    requirement: Both Portal surfaces and Home Assistant parity precede packaged rollout and compatibility recovery proof.

