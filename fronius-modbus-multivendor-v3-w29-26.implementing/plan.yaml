    repo: Project-Helianthus/helianthus-matter-binding-private
    depends_on: [FMV3-M0-07, FMV3-M8-00]
    what: Implement a generic private Matter output-binding kernel from exactly PUBLIC_GRAPHQL_M2M_V1.
