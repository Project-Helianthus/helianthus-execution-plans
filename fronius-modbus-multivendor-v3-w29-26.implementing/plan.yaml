    repo: Project-Helianthus/helianthus-modbusreg
    depends_on: [FMV3-M7-04]
    title: Close mixed-catalog detection and compatibility conformance
    acceptance: Mixed-catalog tests select at most one eligible primary, preserve activation lifecycle, and force ambiguous EMMA or insufficiently distinguished Huawei fixtures to no_match or insufficient_evidence rather than automatic activation.
    gates: [TDD_RED, CI, protocol_interop, testability]
    rollback: Pin the last passing catalog and disable new profile versions independently.
