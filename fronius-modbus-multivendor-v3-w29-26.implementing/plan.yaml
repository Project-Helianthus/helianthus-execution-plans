    acceptance: RED-first tests consume only PUBLIC_GRAPHQL_M2M_V1 through authenticated bounded polling, reject incompatible versions and insecure endpoints, prove credential and reconnect recovery plus stale propagation, and reject Modbus, registry, gateway-internal, undocumented-network, and subscription dependencies.
