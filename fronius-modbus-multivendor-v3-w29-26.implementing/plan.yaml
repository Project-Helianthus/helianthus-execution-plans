    acceptance: Against merged FMV3-M1-00 and M1-05, CI first locks the full merged docs SHA plus policy and manifest SHA-256 values and executes all ledger-owned downstream behavioral tests, including ordered dependency rejection, non-publishable source sets, atomic publish/cancel winners, and closed-projection canary exclusion. Bounded external authorization-evidence selectors identify the M1-06 issue, sequential harness and closing product PRs, merge and RED SHAs, anchored RED/GREEN runs, eight mutation commits/runs, official Codex review, and two owner process attestations. Live GitHub must prove the exact immutable marked/title issue; an earlier owner-authored same-repo harness PR that was the sole active PR, passed required checks and one clean exact-head Codex review before merge, added only the exact plan-anchored dual-mode workflow, AST guard, docs-lock validator, and exact merged-docs lock, preserved inherited ci.yml and ci_local.sh, and is the exact base of the later closing product PR; and the product head/merge tree, one-base-parent squash topology, issue closure, and canonical-main ancestry. The test-only RED ancestor has the exact pinned subject, a bounded non-production first diff page and empty second page, and an exact-SHA exact-PR run of the anchored workflow whose RED guard and compile/no-tests succeed before the exact conformance suite fails. The exact implementation head has required checks pinned to concrete GitHub App IDs plus the same anchored workflow with conformance success. Eight ordered production-Go-only mutant commits each parent directly from GREEN, retain the exact workflow, AST guard, docs-lock validator, and merged-docs lock blobs, match the canonical GitHub patch digest precommitted in the GREEN report, pass executable-AST validation and the mapped parent baseline test, compile, and only then fail the exact mapped mutant test. One official Codex canonical-template zero-inline review and two owner structured process attestations follow GREEN and all mutations and bind the report blob, fixed case digest, and mutation-evidence digest. The owner records attest the fresh OpenAI process but are not represented as independently authenticated OpenAI artifacts; the official Codex review is the authenticated independent product-review surface. The fixed-path closed report binds validator-pinned PASS cases for deliverability exclusions, copy one-winner, stale same-key instance cancellation isolation, terminal outcomes, membership close/registration race, bounds/overflow, sequence exhaustion, and coalesced isolation to exact regular Go test source blobs, exact test declarations, assertion/failure calls, semantic API calls, exact mutation patch digests, and production Go blobs declaring every fixed contract symbol. Runtime acquisitions require the M1 capability while offline_fixture remains untrusted with zero capability CAS and no production sample_id. The independent M2 ledger rejects duplicate exact bounded AttemptKey before state change. Each claim moves unresolved to claim_in_progress only while its attempt is open, records one immutable source result before completion, and cannot retry. Seal atomically requires a nonempty exact ordered all-runtime dependency set, exact cardinality, and every claim to be claim_succeeded; empty, fixture-only, mixed, duplicate, omitted, or reordered sets are rejected before capability CAS. Cancellation linearizes open or sealed to cancelling, blocks later claim admission, seal, and publish, invokes runtime-source-owned CancelOpen by the exact opaque closed AttemptInstance with frozen membership, drains every claim_in_progress, closes only remaining unresolved claims, and then reaches cancelled. Publish() is the one-shot sealed-to-publishing transition over immutable sealed ledger state; publish commit atomically couples the irreversible external effect with publishing-to-published, cancellation wins before that commit with publish_failed and no external effect, while