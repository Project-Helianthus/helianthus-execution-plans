    depends_on: [FMV3-M5-08]
    title: Publish the public Matter binding companion contract
    acceptance: A permissively publishable companion defines PUBLIC_GRAPHQL_M2M_V1 ingress, Matter identity, capability and encoding projection, trust and credential lifecycle, compatibility, stale and unavailable behavior, recovery, and forbidden private or internal dependencies.
