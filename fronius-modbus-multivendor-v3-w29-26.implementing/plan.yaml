    acceptance: A live run records GO only when a fresh qualified Fronius observation traverses PUBLIC_GRAPHQL_M2M_V1 and eeBUS to a matching myVaillant-visible value and identity; replay, cache, fixture, simulator, handshake-only, NO_GO, or STOP evidence cannot satisfy the outcome.
    gates: [CI, hardware_required, protocol_interop, security, recovery]
    rollback: Disable the private export and preserve the sanitized lab trace.
  - id: FMV3-M6-03
    milestone: M6
    repo: Project-Helianthus/helianthus-docs-ebus
    depends_on: [FMV3-M6-02]
    title: Publish reusable eeBUS and myVaillant findings or record STOP
    acceptance: Reusable SHIP/SPINE, trust, identity, encoding, capability, and interoperability findings are published with provenance and secrets removed, or STOP is recorded with no support statement when permissive publication is impossible.
    gates: [doc_gate, licensing, protocol_interop, security]
    rollback: Withdraw disputed public statements and retain STOP without changing runtime contracts.
  - id: FMV3-M7-01
    milestone: M7
    repo: Project-Helianthus/helianthus-docs-ebus
    depends_on: [FMV3-M0-06, FMV3-M1-04, FMV3-M2-03, FMV3-M5-09]
    title: Publish separate SunSpec, Growatt, and Huawei evidence packets
    acceptance: Public packets define provenance-qualified SunSpec, Growatt, and Huawei candidates, map every detector PDU to the runtime read allowlist, distinguish SmartLogger and S-Dongle applicability, and mark missing EMMA discriminators while deferring EMMA semantics.
    gates: [doc_gate, licensing, protocol_interop]
    rollback: Quarantine disputed facts and keep affected support states experimental or Unknown.
  - id: FMV3-M7-02
    milestone: M7
    repo: Project-Helianthus/helianthus-modbusreg
    depends_on: [FMV3-M1-04, FMV3-M2-03, FMV3-M3-03, FMV3-M7-01]
    title: Expand SunSpec with additional versioned standard models
    acceptance: Conformance proves model-chain parsing, units and scales, declared word and byte order, string packing, transport neutrality, version gates, unknown-model handling, and codec-version provenance.
    gates: [TDD_RED, CI, doc_gate, protocol_interop, hardware_conditional]
    rollback: Disable the affected standard profile version in the catalog.
  - id: FMV3-M7-03
    milestone: M7
    repo: Project-Helianthus/helianthus-modbusreg
    depends_on: [FMV3-M7-02]
    title: Decide Growatt admission and add only evidence-supported profiles
    acceptance: Record PROFILE_ADMITTED or NO_ADMISSIBLE_PROFILE from the published evidence; only evidence-supported profiles add RED-first bounded read-only fixtures and code, while non-admission preserves evidence without catalog support and M7-04 remains an ordinary downstream issue requiring current-state triage.
    gates: [CI, licensing, protocol_interop, hardware_conditional, doc_gate, TDD_RED_IF_PROFILE_ADMITTED]
    rollback: Disable an admitted Growatt profile or revise non-admission only when new qualified evidence reopens evaluation.
  - id: FMV3-M7-04
    milestone: M7
    repo: Project-Helianthus/helianthus-modbusreg
    depends_on: [FMV3-M7-03]
    title: Add qualified Huawei SmartLogger and S-Dongle profiles
    acceptance: Each candidate records PROFILE_ADMITTED or NO_ADMISSIBLE_PROFILE, every admitted detector probe uses the versioned runtime read allowlist, only admission adds RED-first code and fixtures, and ambiguous EMMA or insufficiently distinguished devices remain ineligible.
    gates: [CI, doc_gate, protocol_interop, licensing, hardware_conditional, TDD_RED_IF_PROFILE_ADMITTED]
    rollback: Disable the affected Huawei profile and return unconfirmed values to Unknown.
  - id: FMV3-M7-05
