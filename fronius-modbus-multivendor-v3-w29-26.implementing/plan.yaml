    acceptance: Before private implementation, one permissively publishable companion defines the PUBLIC_GRAPHQL_M2M_V1 ingress boundary, Matter identity/capability/encoding projection, trust and credential lifecycle, compatibility, stale/unavailable behavior, recovery, and forbidden private/internal imports without disclosing licensed binding implementation.
    gates: [doc_gate, licensing, protocol_interop, security]
