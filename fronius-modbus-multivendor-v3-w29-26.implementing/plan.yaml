  - id: FMV3-M3-03
    milestone: M3
    complexity: 10
    repo: Project-Helianthus/helianthus-modbusreg
    depends_on: [FMV3-M3-02]
    what: Determine Fronius phase-1 applicability from Modbus TCP evidence and implement only any evidence-required transport-neutral read-only overlay.
    acceptance: Against companion FMV3-M3-01 and M3-02 conformance, record exactly STANDARD_ONLY or OVERLAY_REQUIRED publicly. Modbus TCP is only the phase-1 evidence and acquisition path; overlay code remains transport-neutral and cannot import TCP types or gate activation on TCP. Every Fronius production token is confined to the exact profiles/fronius namespace. CI runs the fixed import-boundary test through an exact executable fail-closed runtime source scanner which enumerates the current proof-package directory, inspects every direct non-test .go source including build-constrained and implicitly excluded filenames, parses imports with go/parser and go/token, unquotes with strconv.Unquote, sorts deterministically, and returns directory/read/parse/unquote errors to t.Fatal. Its exact TCP predicate scans every import-path component with the validator's net/TCP/Modbus-TCP rule and returns the offending path. Direct production and named-test imports are restricted to the validator-pinned transport-neutral standard-library allowlist, with only the scanner's go/parser, go/token, os, path/filepath, runtime, and testing additions admitted for named tests, while module-local, third-party, and every other import fail closed. CI also runs the fixed activation test through a zero-field non-TCP fake with a compile-time assertion against the exact NeutralRuntime interface; its sentinel error must be returned by a real runtime call. The bound minimal neutral adapter has no imports or additional declarations and consists only of one zero-argument error-returning interface method plus the matching activation call. It must be test-only for STANDARD_ONLY and production source inside profiles/fronius for OVERLAY_REQUIRED; an admitted overlay must also contain a separate non-test production implementation source. Both test declarations and scanner helpers must be in one fixed named source, registry/fronius_overlay_test.go for STANDARD_ONLY or profiles/fronius/fronius_overlay_test.go for OVERLAY_REQUIRED. The exact workflow removes every other direct *_test.go sibling in that proof package before a standalone go build of its exact package target for STANDARD_ONLY or every package under ./profiles/fronius/... for OVERLAY_REQUIRED, then runs activation first and import-boundary second against the exact proof package; each exact YAML job/step has no skip, redirect, custom shell, override, or continue-on-error. Candidate overlay production sources have no build constraints, init function, or test-only fake/sentinel references. The validator binds the interface, activation, scanner, and predicate declarations and requires assertion control flow to consume scan errors, offending paths, or the sentinel result. Both dispositions retain evidence, fixtures, live scope, identity/provenance/coherence, read-only behavior, and green conformance CI. STANDARD_ONLY proves the complete exact PR-base-to-head tree diff contains only tests, fixtures, docs, the bound workflow, or fixed evidence and therefore produces no implementation commit, overlay namespace source, or overlay RED evidence. OVERLAY_REQUIRED requires at least one exact-tree profiles/fronius production package with the separate implementation source, plus a RED ancestor whose complete exact parent-tree-to-RED-tree diff is nonempty and test-only, and a failed run on the same PR/workflow ID/path/blob. RED preparation and build succeed, activation specifically fails, and import has no success result; GREEN requires successful preparation, build, activation, and import evidence. Either disposition unblocks M4.
    gates: [CI, doc_gate, protocol_interop, licensing, TDD_RED_IF_OVERLAY_REQUIRED]
    doc_gate: required
    companion_issue: FMV3-M3-01
    tdd_condition: OVERLAY_REQUIRED
    transport_neutrality_gate:
      forbidden_import_test: TestFroniusOverlayRejectsTCPConcreteImports
      neutral_activation_test: TestFroniusOverlayActivatesThroughNeutralRuntime
      production_package_helper: froniusOverlayProductionPackages
      tcp_import_predicate_helper: hasTCPConcreteImport
      runtime_import_scanner: exact_fail_closed_immutable_source_directory_production_go_source_scan
      runtime_scanner_contract: runtime_caller_filepath_dir_absolute_immutable_source_directory_scan
      neutral_runtime_fake: neutralRuntimeNoTCP
      neutral_activation_helper: activateFroniusProfile
      required_for_dispositions: [STANDARD_ONLY, OVERLAY_REQUIRED]
    m3_03_workflow_contract:
      STANDARD_ONLY: {workflow_path: .github/workflows/fmv3-m3-03-conformance.yml, template_path: templates/fmv3-m3-03-conformance.yml, sha256: b74eb7d1c46c25c67c31e4ac796c03889018779412095b335d2f9d58e589e3ad}
      OVERLAY_REQUIRED: {workflow_path: .github/workflows/fmv3-m3-03-overlay-conformance.yml, template_path: templates/fmv3-m3-03-overlay-conformance.yml, sha256: f72fc7b1f3fadc78af5b8dd8dd1529936a040d01f456751ff4224d6b47ab2d85}
    standard_only_contract: {evidence_and_disposition: public, conformance_ci: green, implementation_commit: forbidden, empty_overlay: forbidden}
    completion_evidence_contract: {schema: helianthus.fmv3-m3-03-completion.v2, bind: [head_sha, head_tree_sha, disposition, fixed_profiles_fronius_namespace_scan, canonical_disposition_bound_named_test_source_blob, artifact_named_test_sources_no_init_or_testmain, complete_go_import_literal_unquote_and_unicode_alias_scan, executable_fail_closed_runtime_import_scanner, sealed_transport_neutral_direct_import_allowlist, semicolon_import_declaration_rejection, disposition_bound_minimal_neutral_adapter, overlay_separate_production_implementation_source_without_init_or_test_only_symbols_or_constraints, zero_field_fake_compile_time_interface_assertion, sentinel_result_control_flow, closed_canonical_named_test_bodies, exact_top_level_permissions_contents_read, executable_head_and_tree_assertion, exact_preparation_deletes_all_other_direct_test_sources, exact_standalone_production_build_before_tests, overlay_namespace_has_no_nested_modules_or_go_wildcard_exclusions, activation_first_and_import_second_exact_commands, conditional_overlay_red_commit_and_same_workflow_blob_run, overlay_red_matches_green_canonical_test_source_blob, red_exact_pr_base_parent_and_tree, red_exact_parent_tree_test_only_diff, red_preparation_and_build_success_activation_failure_and_no_import_success, workflow_path_and_blob, workflow_run_attempt, workflow_job_id, workflow_check_run_id, red_workflow_run_attempt, red_job_id, red_check_run_id, green_preparation_build_activation_and_import_success], standard_only_requires_empty_fixed_overlay_namespace: true, overlay_required_requires_nonempty_fixed_overlay_namespace: true, overlay_required_requires_live_test_only_red_evidence: true}
    disposition_contract:
      allowed: [STANDARD_ONLY, OVERLAY_REQUIRED]
      completion_is_progress: true
    rollback: Invalidate the disposition when evidence changes; disable an admitted overlay while minimal SunSpec and raw Modbus access remain available.
