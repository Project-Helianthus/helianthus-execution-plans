  - id: FMV3-M1-05
    milestone: M1
    complexity: 10
    repo: Project-Helianthus/helianthus-docs-ebus
    depends_on: [FMV3-M1-04]
    what: Publish the OPAQUE_RUNTIME_ACQUISITION_V1 companion contract before corrective runtime code.
    acceptance: Plan authorization for this docs issue does not require its PR to be merged; completion does. The exact bound docs R2 head/tree defines source_kind as runtime or offline_fixture. Only the runtime source, after request-bound correlation proves successful data, the dependent remains attached, its exact logical slice validates, and production is coherent, may issue an opaque non-serializable capability from private source-owned state shared solely by copies of that capability and never by an M2 ledger pointer. Caller booleans and every non-success acquisition receive no capability; offline fixtures remain zero-CAS with no production sample identity. Endpoint recreation and every new acquisition create fresh independent state regardless of visible identity or data and cannot alias, remint, reset, or merge prior state. Capability state moves once from open to claimed, cancelled, failed, or expired; runtime-source-owned CancelOpen uses the exact opaque closed AttemptInstance, after atomic membership close blocks late registration and freezes the ordered member set, and returns only after pre-close registrations, member operations, reclamation, and all open members drain. Claims move unresolved to claim_in_progress before one immutable terminal result; cancellation moves open or sealed attempts through cancelling, drains in-progress claims, and closes only remaining unresolved claims; Seal atomically requires a nonempty exact ordered all-runtime dependency set, exact cardinality, and every claim to be claim_succeeded; empty, fixture-only, mixed, duplicate, omitted, or reordered sets are rejected before capability CAS. Finite-positive byte and field limits validate before allocation, checked retained-state products cannot overflow, and capability, attempt, and claim terminal sequences are pre-reserved nonzero uint64 values that never wrap or reuse. Synchronous sequence-ordered reclamation retains only byte-bounded non-reconstructing tombstones, and normalization records round-trip exactly within admitted bounds. A fresh independent OpenAI review of the exact docs revision must close with all findings resolved or NO_FINDINGS before merge.
    gates: [doc_gate, licensing, data_integrity, fresh_adversarial_review]
    doc_gate: companion
    companion_for: [FMV3-M1-06, FMV3-M2-01]
    documents_contract: OPAQUE_RUNTIME_ACQUISITION_V1
    contract_sections: [opaque_single_use_runtime_acquisition_capability, source_kind_runtime_vs_offline_fixture, source_issued_deliverability, attempt_lifecycle_and_bounds, copied_view_and_endpoint_recreation_cas, per_coalesced_dependent_capability, lossless_normalization]
    source_kind_contract:
      allowed: [runtime, offline_fixture]
      runtime:
        capability: required_for_delivery
        deliverability:
          authority: runtime_source_owned
          caller_control: forbidden
          excluded_outcomes: [detached_dependent, cancelled_dependent, protocol_exception, malformed_response, transport_or_dependent_failure, late_or_abandoned_response, uncorrelated_frame, torn_or_incoherent_production, any_non_success_outcome]
          predecessor_contract: docs/platform/modbus-foundation-profile-contract-v1.md#physical-and-logical-identity
          production_stage: post_correlation_successful_dependent_production
          reconstruction: forbidden
          required_conditions: [request_bound_wire_response_id, wire_outcome_successful_data, dependent_still_attached, exact_logical_slice_validated, coherent_production]
          serialization: forbidden
        issuer: runtime_source
        issue_condition: deliverable_runtime_acquisition_only
      offline_fixture: {capability: forbidden, capability_cas_calls: 0, production_sample_id: forbidden, trust: untrusted}
    opaque_runtime_acquisition_contract:
      attempt_instance:
        capability_binding: exact_instance_before_capability_visibility
        identity: opaque_unforgeable_nonserializable_per_attempt_incarnation
        key_role: AttemptKey_documentary_only_not_security_identity
        membership:
          close: ledger_admission_atomic_open_to_closing_blocks_new_registration
          drain: wait_all_preclose_registrations
          freeze: closed_exact_ordered_member_set
          late_registration: reject_without_visible_capability_or_retained_open_state
          states: [open, closing, closed]
        same_key_recreation: fresh_independent_instance
      attempt_binding:
        cancel_open:
          capability_effect: still_open_to_cancelled_terminal_unchanged
          ledger_mutation: forbidden
          lookup: exact_opaque_closed_AttemptInstance_frozen_membership_only
          owner: runtime_source
          return: after_preclose_registrations_member_operations_reclamation_and_no_open_member
        claim_path_after_m2_admission: ledger_linearization_required
        key: immutable_exact_source_owned_AttemptKey
        security_identity: opaque_AttemptInstance_not_AttemptKey
        source_operation: CancelOpen(AttemptInstance)
      bounded_state:
        capabilities: endpoint_configured_hard_limit
        terminal_reclamation: required
        terminal_sequence:
          domain: uint64_1_to_2^64_minus_1
          exhaustion: reject_new_capability_preserve_existing_termination
          reservation: one_before_capability_admission_or_allocation
          reuse: forbidden_within_owner_lifetime_including_after_reclamation
          wrap: forbidden_checked_arithmetic
        tombstone:
          additional_fields: forbidden
          count_bound: capability_tombstone_limit_finite_positive
          eviction: lowest_reserved_terminal_sequence_first
          fields: [schema_version, terminal_sequence, terminal_outcome]
          forbidden_payloads: [raw_attempt_key, source_evidence_id, normalization_record, evidence_payload, capability_representation, free_form_diagnostic]
          max_encoded_bytes: capability_tombstone_max_encoded_bytes_finite_positive
          schema_version: 1
          terminal_outcome: [claimed, cancelled, failed, expired]
          terminal_sequence: reserved_uint64_nonzero
      coalesced_dependents: independent_capability_per_dependent
      copied_view_race: exactly_one_winner
